<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Friday — Local AI Assistant</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="logo">● <b>Friday</b></div>
  <div class="status">
    <span id="dot" class="dot idle"></span>
    <span id="statusText">Idle</span>
    <button id="micBtn" class="mic" title="Hold or click to talk">🎙️</button>
  </div>
</header>

<main id="chat" aria-live="polite">
  <div class="msg friday">
    <div class="avatar">F</div>
    <div class="bubble">Hi, I'm <b>Friday</b> — your local AI assistant (Ollama llama3).
      Try: <i>"what time is it"</i>, <i>"open github.com"</i>, <i>"tell me a joke"</i>,
      or <i>"explain quantum entanglement"</i>.</div>
  </div>
</main>

<form id="composer">
  <input id="input" type="text" placeholder="Type a message or click 🎙️ to talk…" autocomplete="off">
  <button type="submit">Send</button>
</form>

<footer>
  <span>Backend: <code>http://localhost:5000</code></span> ·
  <span>LLM: <code>http://localhost:11434 (llama3)</code></span>
</footer>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
